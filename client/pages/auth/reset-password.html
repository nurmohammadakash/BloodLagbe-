<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | Blood-Lagbe</title>
    <link rel="stylesheet" href="../../css/auth.css">
</head>

<body class="auth-page">
<button class="auth-theme-toggle" data-theme-toggle type="button">☀️ Light</button>
<div style="width:min(500px,92%);margin:120px auto 50px">

<form
    id="resetPasswordForm"
    class="auth-form"
    novalidate
>

    <div class="form-group">

        <label for="otp">
            Reset OTP
        </label>

        <div class="input-wrapper">

            <span class="input-icon">
                🔢
            </span>

            <input
                type="text"
                id="otp"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="6"
                placeholder="Enter the 6-digit OTP"
                required
            >

        </div>

        <small
            class="field-error"
            id="otpError"
        ></small>

    </div>


    <div
        id="passwordFields"
        hidden
    >

        <div class="form-group">

            <label for="password">
                New Password
            </label>

            <div class="input-wrapper">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    id="password"
                    autocomplete="new-password"
                    placeholder="Enter your new password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    data-target="password"
                >
                    Show
                </button>

            </div>

            <small
                class="field-error"
                id="passwordError"
            ></small>

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="input-wrapper">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    id="confirmPassword"
                    autocomplete="new-password"
                    placeholder="Re-enter your new password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    data-target="confirmPassword"
                >
                    Show
                </button>

            </div>

            <small
                class="field-error"
                id="confirmPasswordError"
            ></small>

        </div>

    </div>


    <div
        id="resetMessage"
        class="auth-message"
        role="alert"
    ></div>


    <button
        type="submit"
        id="resetButton"
        class="btn btn-primary auth-submit"
    >
        Verify OTP →
    </button>

</form>


<div class="auth-footer">

    <span>
        Remember your password?
    </span>

    <a href="/login">
        Login
    </a>

</div>


</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="../../js/theme.js"></script>
<script src="../../js/gsap-init.js"></script>
<script src="../../js/reset-password.js"></script>

</body>

</html>
