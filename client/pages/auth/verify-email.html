<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify Email | Blood Lagbe</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f5f5f5;
        }

        .verification-container {
            width: 100%;
            max-width: 420px;

            background: #ffffff;

            padding: 40px 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.10);

            text-align: center;
        }

        /* =====================================================
           LOGO
           ===================================================== */

        .logo {
            font-size: 30px;

            font-weight: bold;

            color: #d90429;

            margin-bottom: 20px;
        }

        /* =====================================================
           TITLE
           ===================================================== */

        h1 {
            font-size: 25px;

            color: #222;

            margin-bottom: 12px;
        }

        /* =====================================================
           DESCRIPTION
           ===================================================== */

        .description {
            font-size: 14px;

            line-height: 1.6;

            color: #666;

            margin-bottom: 28px;
        }

        /* =====================================================
           OTP INPUT
           ===================================================== */

        .otp-input {
            width: 100%;

            padding: 15px;

            border: 1px solid #ccc;

            border-radius: 7px;

            outline: none;

            font-size: 25px;

            text-align: center;

            letter-spacing: 8px;

            transition: 0.2s;
        }

        .otp-input:focus {
            border-color: #d90429;

            box-shadow:
                0 0 0 2px rgba(217, 4, 41, 0.10);
        }

        .otp-input::placeholder {
            color: #aaa;

            letter-spacing: 5px;
        }

        /* =====================================================
           VERIFY BUTTON
           ===================================================== */

        .verify-button {
            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #d90429;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .verify-button:hover {
            background: #b80323;
        }

        .verify-button:disabled {
            background: #999;

            cursor: not-allowed;
        }

        /* =====================================================
           MESSAGE
           ===================================================== */

        .message {
            display: none;

            margin-top: 18px;

            padding: 11px;

            border-radius: 6px;

            font-size: 14px;

            line-height: 1.4;
        }

        .message.success {
            display: block;

            background: #d4edda;

            color: #155724;
        }

        .message.error {
            display: block;

            background: #f8d7da;

            color: #721c24;
        }

        /* =====================================================
           LOGIN LINK
           ===================================================== */

        .login-link {
            margin-top: 22px;

            font-size: 14px;

            color: #666;
        }

        .login-link a {
            color: #d90429;

            text-decoration: none;

            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 480px) {

            .verification-container {
                width: 90%;

                padding: 30px 25px;
            }

            .logo {
                font-size: 26px;
            }

            h1 {
                font-size: 22px;
            }

            .otp-input {
                font-size: 22px;

                letter-spacing: 6px;
            }
        }
    </style>

<link rel="stylesheet" href="../../css/auth.css">
<style>.auth-theme-toggle{color:#222;background:#fff;border-color:#ddd}.light-mode .auth-theme-toggle{color:#222;background:#fff}</style>
</head>


<body data-default-theme="light">
<button class="auth-theme-toggle" data-theme-toggle type="button">🌙 Dark</button>


    <!-- =====================================================
         VERIFICATION CONTAINER
         ===================================================== -->

    <div class="verification-container">


        <!-- =================================================
             LOGO
             ================================================= -->

        <div class="logo">
            🩸 Blood Lagbe
        </div>


        <!-- =================================================
             TITLE
             ================================================= -->

        <h1>
            Verify Your Email
        </h1>


        <!-- =================================================
             DESCRIPTION
             ================================================= -->

        <p class="description">

            We have sent a 6-digit verification code
            to the email address you used during registration.

            <br><br>

            Enter the OTP below to activate your account.

        </p>


        <!-- =================================================
             VERIFICATION FORM
             ================================================= -->

        <form id="verifyForm">


            <!-- OTP -->

            <input
                type="text"
                id="otp"
                class="otp-input"
                placeholder="000000"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
                required
            >


            <!-- VERIFY BUTTON -->

            <button
                type="submit"
                id="verifyButton"
                class="verify-button"
            >

                Verify Email

            </button>


        </form>


        <!-- =================================================
             MESSAGE
             ================================================= -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- =================================================
             LOGIN LINK
             ================================================= -->

        <div class="login-link">

            Already verified?

            <a href="/login">
                Login
            </a>

        </div>


    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script src="../../js/theme.js"></script>
    <script src="../../js/gsap-init.js"></script>
    <script src="../../js/verify-email.js"></script>


</body>

</html>
